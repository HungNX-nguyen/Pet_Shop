<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment/head :: head('Login - PetCare')}">
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div class="relative flex min-h-screen flex-col">
        <!-- Header Fragment -->
        <header th:replace="~{fragment/header :: header}"></header>

        <main class="flex flex-1 items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
            <div
                class="w-full max-w-md space-y-8 bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl shadow-primary/5 border border-primary/5">
                <div class="text-center">
                    <h2 class="mt-2 text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Welcome Back
                    </h2>
                    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Please enter your details to sign in</p>
                </div>

                <form th:action="@{/login}" class="mt-8 space-y-6" method="POST">

                    <div th:if="${success}"
                        class="rounded-lg bg-emerald-50 p-4 text-sm text-emerald-700 border border-emerald-200 flex items-center gap-2">
                        <span class="material-symbols-outlined text-emerald-500 text-lg">check_circle</span>
                        <span th:text="${success}"></span>
                    </div>

                    <div th:if="${param.error}"
                        class="rounded-lg bg-red-50 p-4 text-sm text-red-700 border border-red-200 flex items-center gap-2">
                        <span class="material-symbols-outlined text-red-500 text-lg">error</span>
                        <span>Email hoặc mật khẩu không chính xác!</span>
                    </div>

                    <div th:if="${param.logout}"
                        class="rounded-lg bg-blue-50 p-4 text-sm text-blue-700 border border-blue-200 flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-500 text-lg">info</span>
                        <span>Bạn đã đăng xuất thành công.</span>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
                                for="username">
                                Email hoặc Username
                            </label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">person</span>
                                <input autocomplete="username"
                                    class="block w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-10 py-3 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none text-sm transition-all"
                                    id="username" name="username" placeholder="your_username hoặc email" required
                                    type="text" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
                                for="password">Password</label>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
                                <input autocomplete="current-password"
                                    class="block w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-10 py-3 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none text-sm transition-all"
                                    id="password" name="password" placeholder="••••••••" required type="password" />
                                <button
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                    type="button">
                                    <span class="material-symbols-outlined text-xl">visibility</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary"
                                id="remember-me" name="remember-me" type="checkbox" />
                            <label class="ml-2 block text-sm text-slate-700 dark:text-slate-300"
                                for="remember-me">Remember me</label>
                        </div>
                        <div class="text-sm">
                            <a class="font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot
                                your password?</a>
                        </div>
                    </div>
                    <div>
                        <button
                            class="group relative flex w-full justify-center rounded-lg bg-primary px-4 py-3 text-sm font-bold text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all"
                            type="submit">
                            Sign In
                        </button>
                    </div>
                </form>

                <div class="relative mt-10">
                    <div aria-hidden="true" class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="bg-white dark:bg-slate-900 px-2 text-slate-500">Or continue with</span>
                    </div>
                </div>
                <div class="mt-6 grid grid-cols-2 gap-4">
                    <button
                        class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <img alt="Google Logo" class="h-5 w-5" data-alt="Google colorful brand logo"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIq7k8soWX_HgLAIGFwopIyl_1QzKpiSxCno6J43GOcXgAW-umKp8yECnSxfaFsS0jKRMg46XgCrL2LHzKAFUdtI8kd3Dvi-FzhlyWhiNCD4LXynvzV4_YX2ch4sGuYjaz88RG99u_Pr4YAVEDGTNmvlM8anb86PLYj_R8KVQgKsgRbQ52mfIfJxQNT9_CG4tKJwgDIxXPmiwsBKowwHPD6rew8wXN89C9xdIKGwjddWiSa4941eiqXDSecb-Rq8tpJFPhqtKzbQ" />
                        Google
                    </button>
                    <button
                        class="flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 px-4 py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                        <img alt="Facebook Logo" class="h-5 w-5" data-alt="Facebook brand logo in blue"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDufPwvgprjsj8QLe0VVVH1zSzk2a5M8Cc4zlf-Oa4jOURiEOQkbmMf-VigUOtcozlnTBZkPowTl2I2H6TeltWKGyQvt0h9-vZ0n6MdjUi2hjV301PaRQw2YMevzQtZoEY7qD8KH9S80UpGesFZkPUUsZKtDFcUlhKfP4A1rJMsqJ1gQBmtp56rTl3W0behFKY4Uh3i1NlV4anmDCWsIAeDvZGOY3u351muIb3_lSEV7qFJ75SoHLo8DKbxMwzvD7gh7AGk6_Tk0w" />
                        Facebook
                    </button>
                </div>
                <p class="mt-10 text-center text-sm text-slate-500">
                    Not a member?
                    <a th:href="@{/register}"
                        class="font-bold text-primary hover:text-primary/80 transition-colors">Register for free</a>
                </p>
            </div>
        </main>

        <!-- Footer Fragment -->
        <footer th:replace="~{fragment/footer :: footer}"></footer>

    </div>
</body>

</html>
