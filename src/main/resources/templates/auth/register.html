<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head :: head('PetCare - Create Account')}">
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <!-- Header Fragment -->
        <header th:replace="~{fragment/header :: header}"></header>

        <!-- Main Content: Registration Section -->
        <main class="flex-1 flex items-center justify-center p-6 lg:p-12">
            <div class="w-full max-w-[480px] bg-white dark:bg-background-dark rounded-xl shadow-xl border border-slate-100 dark:border-slate-800 p-8">
                <div class="flex flex-col gap-2 mb-8">
                    <h1 class="text-slate-900 dark:text-slate-100 text-3xl font-black leading-tight tracking-tight">Create Account</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-base font-normal">Join the PetCare community today</p>
                </div>
                <form th:action="@{/register}" method="post" class="flex flex-col gap-5">
                    <div th:if="${error}" class="p-3 rounded-lg bg-red-50 text-red-600 text-sm border border-red-100">
                        <span th:text="${error}"></span>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-slate-800 dark:text-slate-200 text-sm font-semibold">Full Name</label>
                        <input name="fullName" class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base" placeholder="Enter your full name" type="text" required/>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-slate-800 dark:text-slate-200 text-sm font-semibold">Email Address</label>
                        <input name="email" class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base" placeholder="email@example.com" type="email" required/>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-slate-800 dark:text-slate-200 text-sm font-semibold">Password</label>
                        <div class="relative flex items-center">
                            <input name="password" class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 pr-12 text-base" placeholder="Min. 8 characters" type="password" required/>
                            <button class="absolute right-3 text-slate-400 hover:text-primary" type="button">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-slate-800 dark:text-slate-200 text-sm font-semibold">Confirm Password</label>
                        <input name="confirmPassword" class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base" placeholder="Repeat your password" type="password" required/>
                    </div>

                    <div class="flex items-center gap-3 py-2">
                        <input class="rounded border-slate-300 text-primary focus:ring-primary w-5 h-5 cursor-pointer" id="terms" type="checkbox" required/>
                        <label class="text-slate-600 dark:text-slate-400 text-sm cursor-pointer" for="terms">
                            I agree to the <a class="text-primary font-medium hover:underline" href="#">Terms and Conditions</a>
                        </label>
                    </div>

                    <button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg transition-all shadow-md active:scale-[0.98]" type="submit">
                        Register
                    </button>
                </form>
                <!-- Divider -->
                <div class="relative my-8 text-center">
                    <div class="absolute inset-0 flex items-center">
                        <span class="w-full border-t border-slate-200 dark:border-slate-800"></span>
                    </div>
                    <span class="relative bg-white dark:bg-background-dark px-4 text-slate-400 text-sm uppercase tracking-wider">Or continue with</span>
                </div>
                <!-- Social Logins -->
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 rounded-lg py-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                        <img alt="Google" class="size-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCzMq91a2Wz_H2bBiVovIPWkKceueynqtTt2I4pjp5f7YFiLqcmU7_jWTkklDktxMsocgqkRIU42xaO8gGfe_NA5d8YwdnzAu6IccAdlRja_g4Oxeh0UALND505pqERbS8hHCzGBJBB11Ykb4K8Sbqx1a0X7gTDMf27QHSgKXU6tVv7m5u6U41vx78jSkYplh8HUYpU7-dweM7ZA3Wgmq1qLfscmLFBOBR_FxemKrXS4uMHLmb3Le60Ypp1CifxsYlHCKLjWrG7JA"/>
                        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-700 rounded-lg py-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                        <svg class="size-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
                        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Facebook</span>
                    </button>
                </div>
                <!-- Already a member? -->
                <div class="mt-8 text-center">
                    <p class="text-slate-600 dark:text-slate-400 text-sm">
                        Already a member?
                        <a class="text-primary font-bold hover:underline ml-1" th:href="@{/login}">Sign in</a>
                    </p>
                </div>
            </div>
        </main>

        <!-- Footer Fragment -->
        <footer th:replace="~{fragment/footer :: footer}"></footer>

    </div>
</div>
</body></html>
