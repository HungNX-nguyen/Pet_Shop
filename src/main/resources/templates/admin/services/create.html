<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/admin-head :: head('Add New Service')}"></head>
<body class="bg-background font-display">
<div class="min-h-screen flex">

    <div th:replace="~{fragment/admin-sidebar :: sidebar('services')}"></div>

    <div class="flex-1 flex flex-col min-w-0">
        <div th:replace="~{fragment/admin-topbar :: topbar('Create New Service', 'Admin / Services / Add New Service')}"></div>

        <main class="p-6">
            <div class="max-w-6xl mx-auto">
                <div class="bg-white border border-borderSoft rounded-2xl shadow-soft p-6">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-textMain">Create New Service</h2>
                        <p class="text-sm text-textSub mt-1">Configure the details for a new professional service offering for pet owners.</p>
                    </div>

                    <form th:action="@{/admin/services}" th:object="${service}" method="post"
                          class="grid grid-cols-1 xl:grid-cols-3 gap-6">

                        <div class="xl:col-span-2 space-y-5">
                            <div>
                                <label class="block text-sm font-semibold text-textMain mb-2">Service Name</label>
                                <input type="text" th:field="*{name}"
                                       class="w-full rounded-xl border border-borderSoft px-4 py-3 text-sm"/>
                                <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-semibold text-textMain mb-2">Category</label>
                                    <select th:field="*{category}"
                                            class="w-full rounded-xl border border-borderSoft px-4 py-3 text-sm">
                                        <option value="">Select category</option>
                                        <option value="Grooming">Grooming</option>
                                        <option value="Veterinary">Veterinary</option>
                                        <option value="Training">Training</option>
                                        <option value="General">General</option>
                                    </select>
                                    <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>
                                </div>

                                <div>
                                    <label class="block text-sm font-semibold text-textMain mb-2">Base Price ($)</label>
                                    <input type="number" step="0.01" th:field="*{price}"
                                           class="w-full rounded-xl border border-borderSoft px-4 py-3 text-sm"/>
                                    <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-textMain mb-2">Duration (minutes)</label>
                                <input type="number" th:field="*{duration}"
                                       class="w-full rounded-xl border border-borderSoft px-4 py-3 text-sm"/>
                                <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-textMain mb-2">Description</label>
                                <textarea rows="6" th:field="*{description}"
                                          class="w-full rounded-xl border border-borderSoft px-4 py-3 text-sm resize-none"></textarea>
                                <p class="text-red-500 text-sm mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
                            </div>
                        </div>

                        <div class="space-y-5">
                            <div class="bg-slate-50 border border-borderSoft rounded-2xl p-5">
                                <h3 class="text-sm font-bold text-textMain mb-4">Status</h3>
                                <p class="text-sm text-textSub">New service will be created as <span class="font-semibold text-green-600">Active</span> by default.</p>
                            </div>
                        </div>

                        <div class="xl:col-span-3 flex items-center justify-end gap-3 pt-2">
                            <a th:href="@{/admin/services}"
                               class="px-5 py-2.5 rounded-xl border border-borderSoft bg-white text-sm font-semibold text-slate-600 hover:bg-slate-50 transition">
                                Cancel
                            </a>
                            <button type="submit"
                                    class="px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-red-600 transition">
                                Save Service
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
