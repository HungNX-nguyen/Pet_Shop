<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/admin-head :: head('Add New Product')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{fragment/admin-sidebar :: sidebar('products')}"></aside>

    <main class="admin-main">
        <div th:replace="~{fragment/admin-topbar :: topbar('Add New Product', 'Admin / Products / Create')}"></div>

        <div class="page-actions">
            <div>
                <h2 class="page-title">Add New Product</h2>
                <div class="page-subtitle">Fill in the details below to add a new product.</div>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert-ui" style="background:#fff1f2;color:#b91c1c;border:1px solid #fecdd3;" th:text="${errorMessage}"></div>

        <div class="card-ui section-card">
            <form th:action="@{/admin/products/create}"
                  th:object="${productRequest}"
                  method="post"
                  enctype="multipart/form-data"
                  class="form-grid">

                <div class="col-8">
                    <label class="form-label">Product Name</label>
                    <input type="text" th:field="*{name}" class="form-control-ui" placeholder="e.g. Premium Dog Kibble">

                    <div style="height:16px"></div>

                    <div class="form-grid">
                        <div class="col-6">
                            <label class="form-label">Category</label>
                            <select th:field="*{categoryId}" class="form-select-ui">
                                <option value="">Select Category</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}">
                                </option>
                            </select>
                        </div>

                        <div class="col-6">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" th:field="*{price}" class="form-control-ui" placeholder="0.00">
                            <div th:if="${#fields.hasErrors('price')}"
                                 th:errors="*{price}"
                                 style="margin-top:6px; color:#ef4444; font-size:13px;">
                            </div>
                        </div>

                        <div class="col-6">
                            <label class="form-label">Stock Quantity</label>
                            <input type="number" th:field="*{stockQuantity}" class="form-control-ui" placeholder="0">
                        </div>

                        <div class="col-6">
                            <label class="form-label">Status</label>
                            <select th:field="*{isActive}" class="form-select-ui">
                                <option th:value="true">Active</option>
                                <option th:value="false">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div style="height:16px"></div>

                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-textarea-ui" placeholder="Enter product description..."></textarea>
                </div>

                <div class="col-4">
                    <label class="form-label">Product Image</label>
                    <div class="card-ui section-card" style="padding:16px;">
                        <input type="file" th:field="*{imageFile}" id="imageFileInput" accept="image/*" class="form-control-ui">

                        <div style="height:16px"></div>

                        <div style="border:1px dashed var(--border); border-radius:16px; padding:16px; text-align:center; background:#fafafa;">
                            <img id="previewImage"
                                 th:src="@{/images/no-image.png}"
                                 alt="preview"
                                 style="width:100%; max-height:260px; object-fit:contain; border-radius:12px;">
                        </div>
                    </div>
                </div>

                <div class="col-12" style="display:flex; justify-content:flex-end; gap:10px;">
                    <a th:href="@{/admin/products}" class="btn-ui btn-light-ui">Cancel</a>
                    <button type="submit" class="btn-ui btn-primary-ui">Save Product</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const input = document.getElementById("imageFileInput");
        const preview = document.getElementById("previewImage");

        if (input && preview) {
            input.addEventListener("change", function () {
                const file = this.files[0];
                if (file) {
                    preview.src = URL.createObjectURL(file);
                }
            });
        }
    });
</script>
</body>
</html>
