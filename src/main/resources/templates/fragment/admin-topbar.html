<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="topbar(pageTitle, breadcrumb)"
        class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-borderSoft">
    <div class="px-6 py-4 flex items-center justify-between gap-4">

        <!-- Left -->
        <div class="min-w-0">
            <div class="text-sm text-textSub mb-1" th:text="${breadcrumb}">Admin / Dashboard</div>
            <h1 class="text-2xl font-bold text-textMain truncate" th:text="${pageTitle}">Dashboard</h1>
        </div>

        <!-- Right -->
        <div class="flex items-center gap-3">

            <!-- Search -->
            <div class="hidden md:flex items-center bg-slate-50 border border-borderSoft rounded-full px-4 py-2 w-72">
                <span class="material-symbols-outlined text-slate-400 text-[20px] mr-2">search</span>
                <input type="text"
                       placeholder="Search..."
                       class="w-full bg-transparent border-none outline-none text-sm placeholder:text-slate-400 focus:ring-0"/>
            </div>

            <!-- Notifications -->
            <button type="button"
                    class="w-10 h-10 rounded-full border border-borderSoft bg-white hover:bg-slate-50 flex items-center justify-center transition">
                <span class="material-symbols-outlined text-slate-600 text-[20px]">notifications</span>
            </button>

            <!-- Settings -->
            <button type="button"
                    class="w-10 h-10 rounded-full border border-borderSoft bg-white hover:bg-slate-50 flex items-center justify-center transition">
                <span class="material-symbols-outlined text-slate-600 text-[20px]">settings</span>
            </button>

            <!-- User menu -->
            <div sec:authorize="isAuthenticated()" class="relative" id="adminUserMenuWrapper">
                <button type="button"
                        class="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-full border border-borderSoft bg-white hover:bg-slate-50 transition"
                        onclick="(function(e){
                            e.stopPropagation();
                            const dropdown = document.getElementById('adminUserDropdown');
                            const icon = document.getElementById('adminUserChevron');
                            const hidden = dropdown.classList.toggle('hidden');
                            if(icon){ icon.style.transform = hidden ? 'rotate(0deg)' : 'rotate(180deg)'; }
                        })(event)">

                    <div class="w-9 h-9 rounded-full bg-primarySoft flex items-center justify-center overflow-hidden border border-red-100">
                        <img alt="Admin Avatar"
                             class="w-full h-full object-cover"
                             src="https://lh3.googleusercontent.com/aida-public/AB6AXuDD6FGoZDNzBvOlMhXlvQYgK7WrMMGAlQhkhJMd8HSCGsAh9gqlr7Ju4pU7bSba3o6YjUeJ4hb8Im9DrLa3ziC-rLDA4wKD0VpwOwk9QA2dofV6sgqRJfYp-nxQbAclXGAP-eDSK0nxkDrTOvyKYYO5E5LwwEo5rgneZ_WRpZOSa0Bt0wD3V7QvwreTOKMTiICWTOZAiZu_DWWgNYRGHQd7y0zrnykcGgpECOSZc-pJQ3Vb5yLSsRSYqGYG22FAksGpSm1LY_-ooQ"/>
                    </div>

                    <div class="hidden lg:block text-left">
                        <div class="text-sm font-semibold text-textMain truncate max-w-[140px]"
                             sec:authentication="name">admin</div>
                        <div class="text-xs text-textSub">Administrator</div>
                    </div>

                    <span id="adminUserChevron"
                          class="material-symbols-outlined text-slate-500 text-[20px] transition-transform">expand_more</span>
                </button>

                <div id="adminUserDropdown"
                     class="hidden absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-soft border border-borderSoft overflow-hidden">
                    <div class="px-4 py-3 border-b border-borderSoft">
                        <p class="text-xs text-textSub">Signed in as</p>
                        <p class="text-sm font-semibold text-textMain truncate" sec:authentication="name">admin</p>
                    </div>

                    <a th:href="@{/profile}"
                       class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-red-50 hover:text-primary transition">
                        <span class="material-symbols-outlined text-[20px]">account_circle</span>
                        Profile
                    </a>

                    <a th:href="@{/admin/services}"
                       class="flex items-center gap-3 px-4 py-3 text-sm text-slate-700 hover:bg-red-50 hover:text-primary transition">
                        <span class="material-symbols-outlined text-[20px]">dashboard</span>
                        Admin Panel
                    </a>

                    <form th:action="@{/logout}" method="post" class="border-t border-borderSoft">
                        <button type="submit"
                                class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-500 hover:bg-red-50 transition">
                            <span class="material-symbols-outlined text-[20px]">logout</span>
                            Logout
                        </button>
                    </form>
                </div>
            </div>

            <!-- Anonymous -->
            <div sec:authorize="isAnonymous()" class="flex items-center gap-2">
                <a th:href="@{/login}"
                   class="px-4 py-2 text-sm font-semibold text-slate-700 hover:text-primary transition">
                    Login
                </a>
            </div>
        </div>
    </div>
</header>

<script>
    document.addEventListener('click', function (e) {
        const wrapper = document.getElementById('adminUserMenuWrapper');
        const dropdown = document.getElementById('adminUserDropdown');
        const chevron = document.getElementById('adminUserChevron');

        if (!wrapper || !dropdown) return;

        if (!wrapper.contains(e.target)) {
            dropdown.classList.add('hidden');
            if (chevron) chevron.style.transform = 'rotate(0deg)';
        }
    });
</script>

</body>
</html>
